# 발행물 게이트. AGENTS.md 의 Commands 에 있는 것을 그대로 돌린다.
# check-claims 는 여기서 돌리지 않는다. 고정 커밋의 체크아웃과 논문 캐시가 있어야 해서
# 로컬 검증 단계의 몫이다 (.claude/skills/research-verify/SKILL.md).
name: gates
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check-doc
        run: node scripts/check-doc.mjs
      - name: check-prose
        run: node scripts/check-prose.mjs
      - name: check-prose tests
        run: node scripts/test/check-prose.test.mjs
      - name: build-index is a no-op on a clean tree
        run: node scripts/build-index.mjs && git diff --exit-code -- index.html README.md
